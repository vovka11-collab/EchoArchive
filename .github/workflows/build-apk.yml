name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # Устанавливаем Cordova глобально
    - name: Install Cordova
      run: npm install -g cordova

    # Создаем проект Cordova и переносим все файлы вместе с конфигом
    - name: Create Cordova Project
      run: |
        cordova create cordova-app com.vovka11.echoarchive EchoArchive
        rm -rf cordova-app/www/*
        cp index.html cordova-app/www/
        if [ -d css ]; then cp -r css cordova-app/www/; fi
        if [ -d js ]; then cp -r js cordova-app/www/; fi
        if [ -d assets ]; then cp -r assets cordova-app/www/; fi
        if [ -f config.xml ]; then cp config.xml cordova-app/; fi

    # Добавляем платформу Android и собираем APK
    - name: Build Android Platform
      run: |
        cd cordova-app
        cordova platform add android
        cordova build android --debug

    # Выгружаем готовый APK файл в артефакты
    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: EchoArchive-Cordova-APK
        path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk